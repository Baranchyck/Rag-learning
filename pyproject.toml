[project]
name = "rag-learning"
version = "0.1.0"
description = "Hands-on learning project: LangChain and RAG with Groq-hosted LLMs"
readme = "README.md"
authors = [
    { name = "Baranchyck", email = "denysbachynskiy12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
rag-learning = "rag_learning.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
